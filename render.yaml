services:
  - type: web
    name: construction-ai-estimation
    runtime: python
    plan: free
    region: singapore          # closest to India; change if you prefer
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn src.deployment:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_RELOAD
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      # The free plan has 512 MB RAM. A 18-page A1 set peaks around 600 MB at the
      # default 5200 px render, which gets the container OOM-killed mid-job.
      # 2400 px is still well above the 2200 px the CV pass consumes, so analysis
      # quality is unchanged; only the annotated overlay is softer. Raise these
      # if you move to a paid plan.
      - key: CAE_MAX_RENDER_DIMENSION
        value: "2400"
      - key: CAE_DPI
        value: "144"
      - key: CAE_MAX_CONCURRENT_JOBS
        value: "1"

